<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6e6"/>
      <stop offset="0.5" stop-color="#ffcf86"/>
      <stop offset="1" stop-color="#c47a2a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#070908"/>
  <!-- lensed far side of the disk: a ring hugging the top of the shadow -->
  <path d="M18.5 33 A13.5 13.5 0 0 1 45.5 33" fill="none" stroke="url(#disk)" stroke-width="3.2" stroke-linecap="round"/>
  <!-- lensed underside: thin arc below -->
  <path d="M22 35.5 A10 10 0 0 0 42 35.5" fill="none" stroke="#ffcf86" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <!-- shadow -->
  <circle cx="32" cy="33" r="10.2" fill="#070908"/>
  <!-- near side of the disk, crossing in front -->
  <ellipse cx="32" cy="34" rx="25.5" ry="3.6" fill="none" stroke="url(#disk)" stroke-width="3"/>
  <!-- detection-box corners -->
  <path d="M6 12V6h6M52 6h6v6M58 52v6h-6M12 58H6v-6" fill="none" stroke="#a8f07e" stroke-width="2.6" stroke-linecap="square"/>
</svg>
