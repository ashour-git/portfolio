      <text x="196" y="524" font-family="Geist, sans-serif" font-size="13.5" fill="#e7c98b">Fragmentary, coastal, quietly devastating modernist memoir.</text>
      <text x="1040" y="500" font-family="Geist, sans-serif" font-size="12" fill="#f59e0b">similarity 0.91</text>
