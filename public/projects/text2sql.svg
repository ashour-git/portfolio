<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06211c"/>
      <stop offset="0.55" stop-color="#0a332a"/>
      <stop offset="1" stop-color="#0e4a3a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="800" rx="32" fill="url(#bg)"/>
  <rect width="1280" height="800" rx="32" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="1277" height="797" rx="30.5" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- browser chrome -->
  <g aria-hidden="true">
    <circle cx="36" cy="26" r="8" fill="rgba(255,255,255,0.55)"/>
    <circle cx="64" cy="26" r="8" fill="rgba(255,255,255,0.55)"/>
    <circle cx="92" cy="26" r="8" fill="rgba(255,255,255,0.55)"/>
    <rect x="1020" y="12" width="220" height="28" rx="14" fill="rgba(0,0,0,0.3)"/>
    <text x="1036" y="32" font-family="Geist Mono, monospace" font-size="18" fill="rgba(255,255,255,0.5)">https://text2sql.dev</text>
  </g>

  <!-- prompt area -->
  <g font-family="Geist, sans-serif">
    <text x="60" y="80" font-size="22" font-weight="700" fill="#ffffff">Text-to-SQL · GPT-4o</text>
    <rect x="60" y="104" width="860" height="210" rx="20" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="84" y="148" font-size="15" fill="#d1fae5">— Prompt</text>
    <text x="84" y="182" font-size="15" fill="#a7f3d0">"Show total sales per region for the last 30 days,"</text>
    <text x="84" y="206" font-size="15" fill="#a7f3d0">"grouped by country, ordered by revenue desc."</text>
    <rect x="84" y="232" width="120" height="28" rx="14" fill="url(#acc)"/>
    <text x="108" y="251" font-size="14" font-weight="500" fill="#04211a">Generate</text>
    <rect x="212" y="232" width="130" height="28" rx="14" fill="rgba(255,255,255,0.08)"/>
    <text x="232" y="251" font-size="14" fill="#a7f3d0">Validate</text>
  </g>

  <!-- sql output -->
  <rect x="60" y="340" width="860" height="300" rx="20" fill="#0a1412" stroke="rgba(34,211,238,0.25)"/>
  <text x="84" y="380" font-family="Geist Mono, monospace" font-size="14" fill="#5eead4">— Generated &amp; guarded SQL</text>
  <g font-family="Geist Mono, monospace" font-size="15" fill="#99f6e4">
    <text x="84" y="420">SELECT</text>
    <text x="120" y="444">r.country,</text>
    <text x="120" y="468">SUM(o.total) AS revenue</text>
    <text x="84" y="492">FROM</text>
    <text x="120" y="516">      orders o</text>
    <text x="120" y="540">      JOIN regions r ON o.region_id = r.id</text>
    <text x="84" y="564">WHERE</text>
    <text x="120" y="588">      o.created_at &gt;= NOW() - INTERVAL '30 days'</text>
    <text x="84" y="612">GROUP BY r.country ORDER BY revenue DESC;</text>
  </g>

  <!-- safety gates -->
  <rect x="948" y="104" width="272" height="130" rx="20" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <g font-family="Geist, sans-serif">
    <text x="970" y="142" font-size="15" font-weight="500" fill="#d1fae5">Safety gates</text>
    <circle cx="1002" cy="180" r="7" fill="#34d399"/><text x="1020" y="184" font-size="14" fill="#a7f3d0">Injection guard · pass</text>
    <circle cx="1002" cy="216" r="7" fill="#34d399"/><text x="1020" y="220" font-size="14" fill="#a7f3d0">Deterministic validate · pass</text>
    <circle cx="1002" cy="252" r="7" fill="#f59e0b"/><text x="1020" y="256" font-size="14" fill="#fde68a">Dry-run · ok</text>
  </g>
  <rect x="948" y="330" width="304" height="150" rx="20" fill="rgba(34,197,94,0.12)" stroke="rgba(52,211,153,0.3)"/>
  <g font-family="Geist, sans-serif">
    <text x="970" y="372" font-size="15" font-weight="500" fill="#d1fae5">CI / Security</text>
    <text x="970" y="402" font-size="18" font-weight="600" fill="#34d399">18/18 security tests</text>
    <text x="970" y="428" font-size="14" fill="#a7f3d0">GitHub Actions · every push</text>
    <text x="970" y="452" font-size="14" fill="#a7f3d0">Defense-in-depth validation</text>
  </g>
</svg>