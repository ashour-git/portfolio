<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111114"/>
      <stop offset="0.55" stop-color="#1b1b20"/>
      <stop offset="1" stop-color="#26262e"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#94a3b8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#94a3b8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="800" rx="32" fill="url(#bg)"/>
  <rect width="1280" height="800" rx="32" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="1277" height="797" rx="30.5" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- browser chrome -->
  <g aria-hidden="true">
    <circle cx="36" cy="26" r="8" fill="rgba(255,255,255,0.55)"/>
    <circle cx="64" cy="26" r="8" fill="rgba(255,255,255,0.55)"/>
    <circle cx="92" cy="26" r="8" fill="rgba(255,255,255,0.55)"/>
    <rect x="1020" y="12" width="220" height="28" rx="14" fill="rgba(0,0,0,0.3)"/>
    <text x="1036" y="32" font-family="Geist Mono, monospace" font-size="18" fill="rgba(255,255,255,0.5)">https://kepler.vision</text>
  </g>

  <!-- left: inspection console -->
  <g font-family="Geist Mono, monospace">
    <text x="40" y="64" font-size="22" font-weight="700" font-family="Geist, sans-serif" fill="#ffffff">Kepler Vision</text>
    <rect x="40" y="90" width="520" height="40" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="56" y="115" font-size="15" fill="#9b9ba8">python infer.py --model detector --frame live</text>

    <rect x="40" y="150" width="520" height="470" rx="16" fill="#0c0c0f"/>
    <g font-size="15" fill="#8f8f98">
      <text x="60" y="186">$ Kepler-Vision / inference pipeline</text>
      <text x="60" y="216" fill="#a3e635">✓</text><text x="80" y="216">model.pt loaded · weights 148.2 MB</text>
      <text x="60" y="244">✓</text><text x="80" y="244">preprocess: resize 640 → normalize → bgr2rgb</text>
      <text x="60" y="272">✓</text><text x="80" y="272">preprocess → detect → nms · conf 0.25</text>
      <text x="60" y="300" fill="#fbbf24">> decode crop region ...</text>
      <text x="60" y="328" fill="#a3e635">✓</text><text x="80" y="328">detections = 3 (0.96)</text>
      <text x="60" y="356">fps: 42.1 · gpu: 78%</text>
      <text x="60" y="384" fill="#8bd5">frames_processed: 18_204</text>
    </g>
  </g>

  <!-- right: grid of labels -->
  <g font-family="Geist, sans-serif">
    <text x="600" y="64" fill="#e7e7ea">Detected objects</text>
    <rect x="600" y="90" width="620" height="90" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
    <rect x="622" y="110" width="150" height="34" rx="17" fill="rgba(148,163,184,0.2)"/>
    <circle cx="642" cy="127" r="7" fill="#94a3b8"/><text x="656" y="132" font-size="14" fill="#d3d3d8">person · 0.96</text>
    <rect x="790" y="110" width="150" height="34" rx="17" fill="rgba(148,163,184,0.2)"/>
    <circle cx="810" cy="127" r="7" fill="#94a3b8"/><text x="824" y="132" font-size="14" fill="#d3d3d8">backpack · 0.88</text>
    <rect x="958" y="110" width="150" height="34" rx="17" fill="rgba(148,163,184,0.2)"/>
    <circle cx="978" cy="127" r="7" fill="#94a3b8"/><text x="992" y="132" font-size="14" fill="#d3d3d8">chair · 0.74</text>
  </g>

  <!-- console status strip -->
  <rect x="600" y="230" width="620" height="128" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
  <g font-family="Geist, sans-serif">
    <text x="624" y="268" font-size="15" font-weight="500" fill="#ececef">Inference pipeline</text>
    <rect x="624" y="284" width="260" height="26" rx="13" fill="rgba(163,230,53,0.15)"/>
    <text x="642" y="304" font-size="14" fill="#a3e635">● streaming · 42 fps</text>
    <rect x="624" y="320" width="560" height="12" rx="6" fill="rgba(255,255,255,0.08)"/>
    <rect x="624" y="320" width="310" height="12" rx="6" fill="rgba(148,163,184,0.6)"/>
    <text x="624" y="352" font-size="14" fill="#9b9ba0">completed 62%</text>
  </g>
  <g font-family="Geist, sans-serif">
    <rect x="600" y="380" width="300" height="100" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
    <text x="624" y="416" font-size="13" fill="#9b9ba0">model · specialized</text>
    <text x="624" y="442" font-size="14" fill="#d3d3d8">clean inference</text>
    <text x="624" y="462" font-size="13" fill="#6b6b72">capable, production-minded</text>
  </g>
</svg>