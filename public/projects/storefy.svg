<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1e44"/>
      <stop offset="0.55" stop-color="#0e2a5c"/>
      <stop offset="1" stop-color="#12328a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="800" rx="32" fill="url(#bg)"/>
  <rect width="1280" height="800" rx="32" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="1277" height="797" rx="30.5" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- topbar -->
  <g font-family="Geist, sans-serif">
    <text x="40" y="56" font-size="22" font-weight="700" fill="#ffffff">Storefy</text>
    <rect x="200" y="34" width="300" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="214" y="57" font-size="13" fill="#8ab8dd">Search products…</text>
    <g fill="rgba(255,255,255,0.08)"><circle cx="1120" cy="52" r="18"/><circle cx="1170" cy="52" r="18"/></g>
  </g>

  <!-- hero promo -->
  <rect x="40" y="96" width="800" height="200" rx="24" fill="rgba(59,130,246,0.14)" stroke="rgba(96,165,250,0.3)"/>
  <rect x="40" y="96" width="800" height="200" rx="24" fill="url(#acc)" opacity="0.18"/>
  <g font-family="Geist, sans-serif">
    <text x="72" y="160" font-size="26" font-weight="600" fill="#f0f9ff">Generative storefront</text>
    <text x="72" y="196" font-size="14" fill="#bcd8f0">Describe your brand — the POS, catalog and theme are generated for you.</text>
    <rect x="72" y="220" width="150" height="38" rx="19" fill="url(#acc)"/>
    <text x="96" y="244" font-size="14" font-weight="500" fill="#ffffff">Start shaping</text>
  </g>

  <!-- mini product cards -->
  <g font-family="Geist, sans-serif">
    <g>
      <rect x="872" y="96" width="160" height="200" rx="20" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
      <rect x="890" y="112" width="124" height="90" rx="12" fill="rgba(96,165,250,0.25)"/>
      <text x="906" y="230" font-size="13" fill="#e5f3ff">Espresso set</text>
      <text x="906" y="250" font-size="12" fill="#9cc3e2">$49</text>
    </g>
    <g>
      <rect x="1052" y="96" width="160" height="200" rx="20" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
      <rect x="1070" y="112" width="80" height="90" rx="12" fill="rgba(56,189,248,0.25)"/>
      <text x="1140" y="230" font-size="13" fill="#e5f3fe">Milk frother</text>
      <text x="1140" y="250" font-size="12" fill="#9db6e2">$34</text>
    </g>
  </g>

  <!-- multi-tenant row -->
  <rect x="40" y="320" width="1172" height="120" rx="20" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
  <g font-family="Geist, sans-serif">
    <text x="72" y="368" font-size="15" font-weight="500" fill="#e5f3fe">Per-tenant isolation</text>
    <text x="72" y="392" font-size="12.5" fill="#8da6c4">Wildcard subdomains · isolated data per store</text>
    <rect x="72" y="412" width="120" height="26" rx="13" fill="rgba(56,189,248,0.16)" stroke="rgba(125,211,252,0.3)"/>
    <text x="90" y="430" font-size="11" fill="#9adcfb">tenant: cafe-a</text>
    <rect x="212" y="412" width="150" height="26" rx="13" fill="rgba(56,189,248,0.16)" stroke="rgba(125,211,252,0.3)"/>
    <text x="230" y="430" font-size="11" fill="#9adcfb">tenant: roasters.io</text>
    <rect x="382" y="412" width="130" height="26" rx="13" fill="rgba(56,189,248,0.16)" stroke="rgba(125,211,252,0.3)"/>
    <text x="400" y="430" font-size="11" fill="#9adcfb">tenant: pet</text>
  </g>

  <!-- order flow -->
  <g font-family="Geist, sans-serif">
    <text x="40" y="640" font-size="14" font-weight="500" fill="#d8e9f7">Order pipeline</text>
    <g stroke="rgba(125,211,252,0.35)" fill="none">
      <line x1="200" y1="700" x2="400" y2="700"/>
      <line x1="520" y1="700" x2="720" y2="700"/>
      <line x1="840" y1="700" x2="1040" y2="700"/>
    </g>
    <g font-size="12" text-anchor="middle">
      <circle cx="160" cy="700" r="26" fill="rgba(56,189,248,0.2)" stroke="rgba(125,211,252,0.4)"/>
      <text x="160" y="704" fill="#c2e8ff">POS</text>
      <circle cx="460" cy="700" r="26" fill="rgba(56,189,248,0.2)" stroke="rgba(125,211,252,0.4)"/>
      <text x="460" y="704" fill="#c2e8ff">Inngest</text>
      <circle cx="780" cy="700" r="26" fill="rgba(56,189,248,0.2)" stroke="rgba(125,211,252,0.4)"/>
      <text x="780" y="704" fill="#c2e8ff">LLM</text>
      <circle cx="1100" cy="700" r="26" fill="rgba(56,189,248,0.2)" stroke="rgba(125,211,252,0.4)"/>
      <text x="1100" y="704" fill="#c2e8ff">AI</text>
    </g>
  </g>
</svg>